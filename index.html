<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的待办清单</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 18px;font:16px/1.5 system-ui,sans-serif;color:#20283d;background:linear-gradient(135deg,#edf3ff,#f8efff);display:grid;place-items:start center}.card{width:min(100%,520px);padding:32px;background:#ffffffd9;border:1px solid #fff;border-radius:24px;box-shadow:0 20px 60px #39456b1a}h1{margin:0 0 5px;font-size:30px;letter-spacing:-1px}.sub{margin:0 0 18px;color:#7a8297}.entry{display:flex;gap:10px}.entry input{min-width:0;flex:1;padding:13px 15px;border:1px solid #dfe4f0;border-radius:12px;font:inherit;outline:none}.entry input:focus{border-color:#7885f5;box-shadow:0 0 0 3px #7885f526}button{border:0;border-radius:12px;padding:0 18px;background:#6674e8;color:white;font:600 15px inherit;cursor:pointer;transition:transform .2s,background .2s}button:hover{background:#5362d5;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}ul{list-style:none;padding:0;margin:20px 0 0}.task{display:flex;align-items:center;gap:12px;overflow:hidden;padding:13px 10px;border-bottom:1px solid #edf0f6;animation:arrive .32s ease both;transition:opacity .25s,transform .25s,max-height .3s,padding .3s,margin .3s;max-height:90px}.task.removing{opacity:0;transform:translateX(18px);max-height:0;padding-top:0;padding-bottom:0;border:0}.task input{accent-color:#6674e8;width:18px;height:18px;flex:none}.label{flex:1;overflow-wrap:anywhere;position:relative}.done .label{color:#9ba2b2}.done .label:after{content:"";position:absolute;left:0;top:50%;height:1.5px;background:#8d95a8;width:0;animation:strike .25s ease forwards}.del{padding:5px 10px;background:transparent;color:#9299aa;font-size:20px}.del:hover{background:#fff0f1;color:#df5e70}#empty{text-align:center;color:#969db0;padding:24px 0}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes strike{to{width:100%}}@media(max-width:420px){body{padding:20px 12px}.card{padding:24px 18px}.entry{gap:7px}.entry button{padding:0 13px}}
#filters{display:flex;gap:8px;margin-top:12px}#filters button{padding:7px 12px;background:transparent;color:#778099}#filters button[aria-pressed=true]{background:#6674e8;color:white}
#datebar{display:flex;align-items:center;gap:8px;margin:0 0 18px;font-size:14px}#datebar button{padding:5px 11px;background:#fff;color:#5b6478;border:1px solid #dfe4f0;font-weight:600;font-size:13px}#datebar button:hover{background:#f3f5fb;border-color:#c9d1e6}#dateText{flex:1;text-align:center;font-weight:600;color:#3a4257}#notice{font-size:13px;color:#b0793a;background:#fff8ec;border:1px solid #ffe4bf;border-radius:10px;padding:8px 12px;margin:0 0 14px}#history{margin-top:26px;border-top:1px solid #edf0f6;padding-top:16px}#history h2{font-size:13px;color:#7a8297;margin:0 0 10px;font-weight:600;letter-spacing:.5px}#histList{margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}#histList li{margin:0;padding:8px 11px;border-radius:10px;background:#f7f9fd;font-size:13px;color:#5b6478;cursor:pointer;transition:background .2s;display:flex;justify-content:space-between;gap:10px;border:0}#histList li:hover{background:#eff3fb}#histList li.active{background:#e8ecfd;color:#4a56c9;font-weight:600}#histList li.plain{justify-content:center;color:#969db0;cursor:default;background:transparent}.histCount{color:#969db0;font-size:12px;font-variant-numeric:tabular-nums}#histList li.active .histCount{color:#6b76d6}
</style>
</head>
<body>
<main class="card"><h1>我的待办清单</h1><p class="sub">一步一步来，每天进步一点。</p>
<div id="datebar"><button id="prevDay" type="button" aria-label="前一天">‹</button><span id="dateText"></span><button id="nextDay" type="button" aria-label="后一天">›</button><button id="todayBtn" type="button">今天</button></div>
<p id="notice" hidden>正在查看历史记录，只有今天可以编辑。</p>
<form class="entry" id="form"><input id="input" placeholder="今天要做什么？" autocomplete="off" aria-label="新任务"><button type="submit">添加</button></form>
<div id="filters" aria-label="筛选任务"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="active" aria-pressed="false">未完成</button><button type="button" data-filter="completed" aria-pressed="false">已完成</button></div>
<ul id="list"></ul><div id="empty">今天还没有任务 ✨</div>
<section id="history"><h2>历史记录</h2><ul id="histList"></ul></section>
</main>
<script>
const DAYKEY="daily-tasks-days",OLDKEY="daily-tasks";
const list=document.querySelector("#list"),empty=document.querySelector("#empty"),form=document.querySelector("#form"),input=document.querySelector("#input"),filters=document.querySelector("#filters"),dateText=document.querySelector("#dateText"),prevBtn=document.querySelector("#prevDay"),nextBtn=document.querySelector("#nextDay"),todayBtn=document.querySelector("#todayBtn"),histList=document.querySelector("#histList"),notice=document.querySelector("#notice"),addBtn=form.querySelector("button");

const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const WEEK="日一二三四五六";
const pretty=k=>{const d=parseKey(k);return (d.getMonth()+1)+"月"+d.getDate()+"日 周"+WEEK[d.getDay()];};
const shift=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);};
const TODAY=dkey(new Date());

let db=JSON.parse(localStorage.getItem(DAYKEY)||"null");
if(!db){
  db={};
  const old=JSON.parse(localStorage.getItem(OLDKEY)||"[]");
  if(Array.isArray(old)&&old.length) db[TODAY]=old;
  localStorage.setItem(DAYKEY,JSON.stringify(db));
}
const save=()=>localStorage.setItem(DAYKEY,JSON.stringify(db));
const tasksOf=k=>db[k]||[];
const isToday=()=>viewDate===TODAY;

let viewDate=TODAY,activeFilter="all";

function renderHistory(){
  histList.innerHTML="";
  const keys=Object.keys(db).filter(k=>k<=TODAY&&(db[k]||[]).length).sort().reverse();
  if(!keys.length){
    const li=document.createElement("li");li.className="plain";li.textContent="还没有历史记录";histList.append(li);return;
  }
  keys.forEach(k=>{
    const arr=db[k],done=arr.filter(t=>t.done).length;
    const li=document.createElement("li");
    if(k===viewDate)li.className="active";
    const name=document.createElement("span");name.textContent=pretty(k);
    const cnt=document.createElement("span");cnt.className="histCount";cnt.textContent=done+"/"+arr.length;
    li.append(name,cnt);
    li.onclick=()=>{viewDate=k;render();};
    histList.append(li);
  });
}

function render(){
  const editable=isToday(),tasks=tasksOf(viewDate);
  const visible=tasks.filter(t=>activeFilter==="all"||(activeFilter==="active"?!t.done:t.done));
  list.innerHTML="";
  visible.forEach(t=>{
    const li=document.createElement("li");
    li.className="task"+(t.done?" done":"");
    li.innerHTML='<input type="checkbox" aria-label="标记完成"><span class="label"></span><button class="del" aria-label="删除任务">×</button>';
    li.querySelector(".label").textContent=t.text;
    const cb=li.querySelector("input");
    cb.checked=t.done;cb.disabled=!editable;
    cb.onchange=()=>{t.done=!t.done;li.classList.toggle("done",t.done);save();renderHistory();};
    const del=li.querySelector(".del");
    del.style.visibility=editable?"visible":"hidden";
    del.onclick=()=>{li.classList.add("removing");setTimeout(()=>{db[viewDate]=tasksOf(viewDate).filter(x=>x.id!==t.id);save();render();},300);};
    list.append(li);
  });
  empty.hidden=visible.length>0;
  empty.textContent=tasks.length===0?(editable?"今天还没有任务 ✨":"这天没有记录"):"没有符合条件的任务";

  dateText.textContent=pretty(viewDate)+(editable?" · 今天":"");
  prevBtn.disabled=false;
  nextBtn.disabled=viewDate>=TODAY;
  todayBtn.disabled=editable;
  input.disabled=!editable;
  addBtn.disabled=!editable;
  notice.hidden=editable;
  filters.querySelectorAll("button").forEach(b=>b.disabled=!editable);
  renderHistory();
}

prevBtn.onclick=()=>{viewDate=shift(viewDate,-1);render();};
nextBtn.onclick=()=>{if(viewDate<TODAY){viewDate=shift(viewDate,1);render();}};
todayBtn.onclick=()=>{viewDate=TODAY;render();};

filters.onclick=e=>{
  const b=e.target.closest("[data-filter]");
  if(!b||b.disabled)return;
  activeFilter=b.dataset.filter;
  filters.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render();
};

form.onsubmit=e=>{
  e.preventDefault();
  if(!isToday())return;
  const text=input.value.trim();
  if(!text)return;
  if(!db[viewDate])db[viewDate]=[];
  db[viewDate].push({id:Date.now(),text,done:false});
  save();input.value="";input.focus();render();
};

render();
</script>
</body>
</html>
