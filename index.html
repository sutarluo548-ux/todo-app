<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var _t=localStorage.getItem("daily-tasks-theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");document.documentElement.dataset.theme=_t;}catch(e){}</script>
<title>我的待办清单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237b87f0'/%3E%3Cstop offset='1' stop-color='%235a67e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='17' fill='url(%23g)'/%3E%3Cpath d='M18 34 L27 43 L45 24' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M49 8.8 L50.5 11.5 L53.2 13 L50.5 14.5 L49 17.2 L47.5 14.5 L44.8 13 L47.5 11.5 Z' fill='white'/%3E%3Cpath d='M55.5 22.3 L56.3 23.7 L57.7 24.5 L56.3 25.3 L55.5 26.7 L54.7 25.3 L53.3 24.5 L54.7 23.7 Z' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6674e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办清单">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme:light;
  --bg1:#edf3ff; --bg2:#f8efff;
  --card:#ffffffd9; --card-border:#ffffff; --card-shadow:0 20px 60px #39456b1a;
  --text:#20283d; --text-sub:#7a8297; --muted:#9ba2b2;
  --line:#edf0f6; --surface:#ffffff; --hover:#f3f5fb; --input-border:#dfe4f0;
  --accent:#6674e8; --accent-hover:#5362d5; --accent-ring:#7885f526; --accent-text:#ffffff;
  --del-hover:#fff0f1; --del-color:#df5e70;
  --notice-bg:#fff8ec; --notice-border:#ffe4bf; --notice-text:#b0793a;
  --hist-bg:#f7f9fd; --hist-active-bg:#e8ecfd; --hist-active-fg:#4a56c9;
  --tpl-bg:#f2f5fd; --tpl-border:#e4e9f7; --tpl-fg:#4f5975;
  --badge-bg:#eef1fd; --badge-fg:#7d88c9;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#12141f; --bg2:#1b1730;
  --card:#1e2338ee; --card-border:#2b3350; --card-shadow:0 20px 60px #00000059;
  --text:#e9ecf7; --text-sub:#98a1bb; --muted:#79829c;
  --line:#2a3149; --surface:#171c2c; --hover:#252d47; --input-border:#333c5a;
  --accent:#7b87f0; --accent-hover:#8f9bf7; --accent-ring:#7b87f033;
  --del-hover:#3a2733; --del-color:#e2707f;
  --notice-bg:#2a2417; --notice-border:#463a1e; --notice-text:#e3b877;
  --hist-bg:#232a42; --hist-active-bg:#303a68; --hist-active-fg:#bcc5ff;
  --tpl-bg:#252c48; --tpl-border:#333c5a; --tpl-fg:#c3cae2;
  --badge-bg:#303a68; --badge-fg:#bcc5ff;
}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 18px;font:16px/1.5 system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:grid;place-items:start center;transition:color .22s ease}.card{width:min(100%,520px);padding:32px;background:var(--card);border:1px solid var(--card-border);border-radius:24px;box-shadow:var(--card-shadow);transition:background-color .22s ease,border-color .22s ease}.brand{display:flex;align-items:center;gap:11px;margin:0 0 6px}.brand h1{margin:0;font-size:30px;letter-spacing:-1px}h1{margin:0 0 5px;font-size:30px;letter-spacing:-1px}.sub{margin:0 0 18px;color:var(--text-sub)}.logo{width:38px;height:38px;flex:none;display:block;filter:drop-shadow(0 4px 10px #5a67e03d)}.logo .ck{stroke-dasharray:42;stroke-dashoffset:42;animation:logoDraw .7s .1s ease forwards}.logo .sp{opacity:0;transform-origin:49px 13px;animation:logoPop .45s .62s ease forwards}.logo .sp2{opacity:0;transform-origin:55.5px 24.5px;animation:logoPop .4s .82s ease forwards}@keyframes logoDraw{to{stroke-dashoffset:0}}@keyframes logoPop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.3)}100%{opacity:.9;transform:scale(1)}}
.theme{margin-left:auto;flex:none;width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1;border-radius:12px;background:var(--surface);border:1px solid var(--input-border);color:var(--text-sub);transition:background-color .2s,border-color .2s,transform .2s}.theme:hover{background:var(--hover);transform:translateY(-1px)}
.entry{display:flex;gap:10px}.entry input{min-width:0;flex:1;padding:13px 15px;border:1px solid var(--input-border);border-radius:12px;font:inherit;outline:none;background:var(--surface);color:var(--text);transition:background-color .22s ease,border-color .22s ease,color .22s ease}.entry input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}button{border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-text);font:600 15px inherit;cursor:pointer;transition:transform .2s,background .2s}button:hover{background:var(--accent-hover);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}ul{list-style:none;padding:0;margin:20px 0 0}.task{display:flex;align-items:center;gap:12px;overflow:hidden;padding:13px 10px;border-bottom:1px solid var(--line);animation:arrive .32s ease both;transition:opacity .25s,transform .25s,max-height .3s,padding .3s,margin .3s,border-color .22s}.task.removing{opacity:0;transform:translateX(18px);max-height:0;padding-top:0;padding-bottom:0;border:0}.task input{accent-color:var(--accent);width:18px;height:18px;flex:none}.label{flex:1;overflow-wrap:anywhere;position:relative}.done .label{color:var(--muted)}.done .label:after{content:"";position:absolute;left:0;top:50%;height:1.5px;background:var(--muted);width:0;animation:strike .25s ease forwards}.del{padding:5px 10px;background:transparent;color:var(--muted);font-size:20px}.del:hover{background:var(--del-hover);color:var(--del-color)}#empty{text-align:center;color:var(--muted);padding:24px 0}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes strike{to{width:100%}}@media(max-width:420px){body{padding:20px 12px}.card{padding:24px 18px}.entry{gap:7px}.entry button{padding:0 13px}}
#filters{display:flex;gap:8px;margin-top:12px}#filters button{padding:7px 12px;background:transparent;color:var(--text-sub)}#filters button[aria-pressed=true]{background:var(--accent);color:var(--accent-text)}
#datebar{display:flex;align-items:center;gap:8px;margin:0 0 18px;font-size:14px}#datebar button{padding:5px 11px;background:var(--surface);color:var(--text-sub);border:1px solid var(--input-border);font-weight:600;font-size:13px}#datebar button:hover{background:var(--hover);border-color:var(--accent)}#dateText{flex:1;text-align:center;font-weight:600;color:var(--text)}#notice{font-size:13px;color:var(--notice-text);background:var(--notice-bg);border:1px solid var(--notice-border);border-radius:10px;padding:8px 12px;margin:0 0 14px}#history,#tpl{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}#history h2,#tpl h2{font-size:13px;color:var(--text-sub);margin:0 0 10px;font-weight:600;letter-spacing:.5px}#histList{margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}#histList li{margin:0;padding:8px 11px;border-radius:10px;background:var(--hist-bg);font-size:13px;color:var(--text-sub);cursor:pointer;transition:background-color .2s;display:flex;justify-content:space-between;gap:10px;border:0}#histList li:hover{background:var(--hover)}#histList li.active{background:var(--hist-active-bg);color:var(--hist-active-fg);font-weight:600}#histList li.plain{justify-content:center;color:var(--muted);cursor:default;background:transparent}.histCount{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}#histList li.active .histCount{color:var(--hist-active-fg);opacity:.8}
#tplForm input{padding:9px 13px;font-size:14px}#tplForm button{padding:0 15px;font-size:14px}#tplList{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px}#tplList li{margin:0;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--tpl-bg);color:var(--tpl-fg);font-size:13px;border:1px solid var(--tpl-border)}#tplList li.plain{background:transparent;border:0;color:var(--muted);padding-left:0}.tplDel{background:transparent;color:var(--muted);font-size:15px;padding:0 2px;line-height:1;border:0}.tplDel:hover{background:transparent;color:var(--del-color);transform:none}.badge{font-size:11px;color:var(--badge-fg);background:var(--badge-bg);border-radius:6px;padding:1px 6px;flex:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card"><div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b87f0"/><stop offset="1" stop-color="#5a67e0"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="17" fill="url(#lg)"/><path class="ck" d="M18 34 L27 43 L45 24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="sp" d="M49 8.8 L50.5 11.5 L53.2 13 L50.5 14.5 L49 17.2 L47.5 14.5 L44.8 13 L47.5 11.5 Z" fill="#fff"/><path class="sp2" d="M55.5 22.3 L56.3 23.7 L57.7 24.5 L56.3 25.3 L55.5 26.7 L54.7 25.3 L53.3 24.5 L54.7 23.7 Z" fill="#fff"/></svg><h1>我的待办清单</h1><button id="themeBtn" class="theme" type="button" aria-label="切换主题" title="切换明暗主题">🌙</button></div><p class="sub">一步一步来，每天进步一点。</p>
<div id="datebar"><button id="prevDay" type="button" aria-label="前一天">‹</button><span id="dateText"></span><button id="nextDay" type="button" aria-label="后一天">›</button><button id="todayBtn" type="button">今天</button></div>
<p id="notice" hidden>正在查看历史记录，只有今天可以编辑。</p>
<form class="entry" id="form"><input id="input" placeholder="今天要做什么？" autocomplete="off" aria-label="新任务"><button type="submit">添加</button></form>
<div id="filters" aria-label="筛选任务"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="active" aria-pressed="false">未完成</button><button type="button" data-filter="completed" aria-pressed="false">已完成</button></div>
<ul id="list"></ul><div id="empty">今天还没有任务 ✨</div>
<section id="history"><h2>历史记录</h2><ul id="histList"></ul></section>
<section id="tpl"><h2>每日重复任务（每天自动出现在清单里）</h2><form class="entry" id="tplForm"><input id="tplInput" placeholder="例如：喝水、运动、读书" autocomplete="off" aria-label="每日重复任务"><button type="submit">添加</button></form><ul id="tplList"></ul></section>
</main>
<script>
const DAYKEY="daily-tasks-days",OLDKEY="daily-tasks",TPLKEY="daily-tasks-template",SEEDKEY="daily-tasks-seeded-day",THEMEKEY="daily-tasks-theme";
const list=document.querySelector("#list"),empty=document.querySelector("#empty"),form=document.querySelector("#form"),input=document.querySelector("#input"),filters=document.querySelector("#filters"),dateText=document.querySelector("#dateText"),prevBtn=document.querySelector("#prevDay"),nextBtn=document.querySelector("#nextDay"),todayBtn=document.querySelector("#todayBtn"),histList=document.querySelector("#histList"),notice=document.querySelector("#notice"),addBtn=form.querySelector("button"),tplForm=document.querySelector("#tplForm"),tplInput=document.querySelector("#tplInput"),tplList=document.querySelector("#tplList"),themeBtn=document.querySelector("#themeBtn");

// ---- 主题 ----
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  themeBtn.textContent=t==="dark"?"☀️":"🌙";
  themeBtn.setAttribute("aria-label",t==="dark"?"切换到亮色主题":"切换到暗色主题");
  themeBtn.title=t==="dark"?"切换到亮色主题":"切换到暗色主题";
}
applyTheme(document.documentElement.dataset.theme==="dark"?"dark":"light");
themeBtn.onclick=()=>{
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
  try{localStorage.setItem(THEMEKEY,next);}catch(e){}
  applyTheme(next);
};

const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const WEEK="日一二三四五六";
const pretty=k=>{const d=parseKey(k);return (d.getMonth()+1)+"月"+d.getDate()+"日 周"+WEEK[d.getDay()];};
const shift=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);};
const todayKey=()=>dkey(new Date());

let seq=0;const newId=()=>Date.now()*1000+(seq++%1000);

// ---- 数据装载 ----
let db=JSON.parse(localStorage.getItem(DAYKEY)||"null");
if(!db){
  db={};
  const old=JSON.parse(localStorage.getItem(OLDKEY)||"[]");
  if(Array.isArray(old)&&old.length) db[todayKey()]=old;
  localStorage.setItem(DAYKEY,JSON.stringify(db));
}
let templates=JSON.parse(localStorage.getItem(TPLKEY)||"[]");
if(!Array.isArray(templates))templates=[];

const save=()=>localStorage.setItem(DAYKEY,JSON.stringify(db));
const saveTpl=()=>localStorage.setItem(TPLKEY,JSON.stringify(templates));
const tasksOf=k=>db[k]||[];

let TODAY=todayKey(),viewDate=TODAY,activeFilter="all";

// ---- 模板注入：每天只注入一次 ----
function seedDay(k){
  if(!templates.length)return;
  const arr=db[k]||(db[k]=[]);
  let changed=false;
  templates.forEach(text=>{
    if(!arr.some(t=>t.text===text)){arr.push({id:newId(),text,done:false,tpl:true});changed=true;}
  });
  if(changed)save();
}
function ensureSeededToday(){
  const t=todayKey();
  if(localStorage.getItem(SEEDKEY)!==t){seedDay(t);localStorage.setItem(SEEDKEY,t);}
}
function checkRollover(){
  const t=todayKey();
  if(t!==TODAY){const wasToday=viewDate===TODAY;TODAY=t;if(wasToday)viewDate=t;ensureSeededToday();render();}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkRollover();});
setInterval(checkRollover,60000);

// ---- 渲染 ----
function renderTpl(){
  tplList.innerHTML="";
  if(!templates.length){const li=document.createElement("li");li.className="plain";li.textContent="还没有设置，添加后会每天自动出现";tplList.append(li);return;}
  templates.forEach((text,i)=>{
    const li=document.createElement("li");
    const sp=document.createElement("span");sp.textContent=text;
    const btn=document.createElement("button");btn.className="tplDel";btn.type="button";btn.textContent="×";btn.setAttribute("aria-label","移除 "+text);
    btn.onclick=()=>{
      const removed=templates.splice(i,1)[0];
      saveTpl();
      // 今天已生成的那条保留（不删数据），但去掉「每日」标记，因为模板里已经没有它了
      const arr=db[TODAY]||[];
      arr.forEach(t=>{if(t.text===removed)delete t.tpl;});
      save();renderTpl();render();
    };
    li.append(sp,btn);tplList.append(li);
  });
}

function renderHistory(){
  histList.innerHTML="";
  const keys=Object.keys(db).filter(k=>k<=TODAY&&(db[k]||[]).length).sort().reverse();
  if(!keys.length){const li=document.createElement("li");li.className="plain";li.textContent="还没有历史记录";histList.append(li);return;}
  keys.forEach(k=>{
    const arr=db[k],done=arr.filter(t=>t.done).length;
    const li=document.createElement("li");
    if(k===viewDate)li.className="active";
    const name=document.createElement("span");name.textContent=pretty(k);
    const cnt=document.createElement("span");cnt.className="histCount";cnt.textContent=done+"/"+arr.length;
    li.append(name,cnt);
    li.onclick=()=>{viewDate=k;render();};
    histList.append(li);
  });
}

function render(){
  const editable=viewDate===TODAY,tasks=tasksOf(viewDate);
  const visible=tasks.filter(t=>activeFilter==="all"||(activeFilter==="active"?!t.done:t.done));
  list.innerHTML="";
  visible.forEach(t=>{
    const li=document.createElement("li");
    li.className="task"+(t.done?" done":"");
    li.innerHTML='<input type="checkbox" aria-label="标记完成"><span class="label"></span><button class="del" aria-label="删除任务">×</button>';
    if(t.tpl){const b=document.createElement("span");b.className="badge";b.textContent="每日";li.insertBefore(b,li.querySelector(".label"));}
    li.querySelector(".label").textContent=t.text;
    const cb=li.querySelector("input");
    cb.checked=t.done;cb.disabled=!editable;
    cb.onchange=()=>{t.done=!t.done;li.classList.toggle("done",t.done);save();renderHistory();};
    const del=li.querySelector(".del");
    del.style.visibility=editable?"visible":"hidden";
    del.onclick=()=>{li.classList.add("removing");setTimeout(()=>{db[viewDate]=tasksOf(viewDate).filter(x=>x.id!==t.id);save();render();},300);};
    list.append(li);
  });
  empty.hidden=visible.length>0;
  empty.textContent=tasks.length===0?(editable?"今天还没有任务 ✨":"这天没有记录"):"没有符合条件的任务";

  dateText.textContent=pretty(viewDate)+(editable?" · 今天":"");
  prevBtn.disabled=false;
  nextBtn.disabled=viewDate>=TODAY;
  todayBtn.disabled=editable;
  input.disabled=!editable;
  addBtn.disabled=!editable;
  notice.hidden=editable;
  filters.querySelectorAll("button").forEach(b=>b.disabled=!editable);
  tplInput.disabled=!editable;
  tplForm.querySelector("button").disabled=!editable;
  renderHistory();renderTpl();
}

// ---- 交互 ----
prevBtn.onclick=()=>{viewDate=shift(viewDate,-1);render();};
nextBtn.onclick=()=>{if(viewDate<TODAY){viewDate=shift(viewDate,1);render();}};
todayBtn.onclick=()=>{viewDate=TODAY;render();};

filters.onclick=e=>{const b=e.target.closest("[data-filter]");if(!b||b.disabled)return;activeFilter=b.dataset.filter;filters.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();};

form.onsubmit=e=>{
  e.preventDefault();
  if(viewDate!==TODAY)return;
  const text=input.value.trim();if(!text)return;
  if(!db[viewDate])db[viewDate]=[];
  db[viewDate].push({id:newId(),text,done:false});
  save();input.value="";input.focus();render();
};

tplForm.onsubmit=e=>{
  e.preventDefault();
  if(viewDate!==TODAY)return;
  const text=tplInput.value.trim();if(!text)return;
  if(templates.includes(text)){tplInput.value="";return;}
  templates.push(text);saveTpl();
  seedDay(TODAY);
  tplInput.value="";tplInput.focus();render();
};

ensureSeededToday();
render();

// PWA：注册 Service Worker，实现离线可用
// （file:// 或 http 下浏览器会拒绝注册，静默忽略即可，不影响本地使用）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
